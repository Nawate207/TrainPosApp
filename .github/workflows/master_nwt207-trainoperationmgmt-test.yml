# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy static site to Azure Web App - Nwt207-TrainOperationMgmt-Test

on:
  push:
    branches:
      - master
  workflow_dispatch:

# GITHUB_TOKEN は読み取りのみに制限する（Azure へのデプロイは publish-profile のシークレットで行うため書き込み権限は不要）
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 外部アクションは、タグの付け替えによる改ざんを防ぐためコミット SHA で固定している（括弧内は固定時点のタグ）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # サイトの表示に必要なファイルだけを stage に集める。
      # 旧ツリー（!old）の PHP、functions/、package.json、ソース（.jsx）などは公開しない（許可リスト方式）
      - name: Stage only the files the site needs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item -LiteralPath index.html, stationList.js, re-content.js, re-style.css, re-tailwind.css -Destination stage
          Copy-Item -LiteralPath vendor -Destination stage -Recurse
          if (Test-Path -LiteralPath 'stage/!old') { throw 'legacy tree must not be staged' }
          Get-ChildItem -Path stage -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path stage).Path.Length + 1) }

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: stage

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        id: deploy-to-webapp
        with:
          app-name: 'Nwt207-TrainOperationMgmt-Test'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_62AEE51AA1A04248B2508F51D3876033 }}
          package: .
