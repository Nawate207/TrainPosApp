<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- XSS 対策の多層防御：スクリプト／CSSは同一オリジンのみ許可し、通信先は Logic Apps に限定する（GitHub Pages は HTTP ヘッダーを設定できないため meta で指定） -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://prod-38.japaneast.logic.azure.com; base-uri 'none'; form-action 'none'; object-src 'none'">
    <meta name="referrer" content="no-referrer">
    <title>列車走行位置ビューア</title>

    <!-- Tailwind CSS（ビルド済み静的CSS。インターネット接続不要） -->
    <link rel="stylesheet" href="./re-tailwind.css">

    <!-- 列車情報の配色などドメイン固有スタイル -->
    <link rel="stylesheet" href="./re-style.css">

    <!-- React / ReactDOM（ローカルにベンダリング済みのUMDビルド。インターネット接続不要） -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <!-- 駅マスタ（既存ファイルをそのまま利用） -->
    <script src="./stationList.js"></script>
    <!-- モダンUI実装（re-content.jsx をビルド時に事前コンパイルしたプレーンJS。実行時のJSX変換は不要） -->
    <script src="./re-content.js"></script>
</body>
</html>
